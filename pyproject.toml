[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vhs-restore-studio"
version = "0.1.0"
description = "A local, fidelity-first VHS restoration studio for Windows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
vhs-restore = "vhs_restore:main"

[tool.setuptools.packages.find]
where = ["src"]
